aid: adonis
name: Adonis
description: >-
  Adonis is a healthcare Revenue Cycle Management (RCM) technology company that
  helps physician groups, hospitals, health systems, digital health
  organizations, and practice management services maximize revenue and reduce
  the cost and time of collections. Founded in 2022 and headquartered at 3 World
  Trade Center in New York, Adonis pairs an AI orchestration platform (Adonis AI
  Agents, Adonis Intelligence, and Adonis Orchestration) with real-time patient
  eligibility and benefits verification, denial prevention, claims and payment
  automation, and revenue analytics. The platform integrates with electronic
  health record and practice management systems including Epic, athenahealth,
  eClinicalWorks, AdvancedMD, NextGen, DrChrono, Canvas, Healthie, Office Ally,
  Change Healthcare, and Availity, and exposes API access (for example Patient
  Verification) for building patient onboarding and intake experiences. Adonis
  is a General Catalyst portfolio company and has raised over $95M across Series
  A through Series C from General Catalyst, Quadrille Capital, Bling Capital,
  Max Ventures, and Homebrew.
